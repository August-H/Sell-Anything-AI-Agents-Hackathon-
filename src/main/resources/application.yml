server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: email-generator
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

openai:
  api:
    key: ${OPENAI_API_KEY}
    model: gpt-4
    temperature: 0.7
    max-tokens: 2000

perplexity:
  api:
    key: ${PERPLEXITY_API_KEY}
    model: sonar-pro
    max-tokens: 1300

logging:
  level:
    com.aiagents.emailgen: DEBUG
    org.springframework.web: INFO
    
cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600 